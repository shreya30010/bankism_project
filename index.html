<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="BANKISM — a defensive demo of an AI firewall between natural language and simulated financial actions.">
<title>BANKISM — AI Firewall for Financial Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#06080c;--bg2:#0a0e14;--panel:#0d1219;--panel2:#111823;--line:rgba(148,177,214,.12);--line2:rgba(148,177,214,.22);--tx:#e6edf6;--mut:#8b9bb0;--dim:#5b6a7d;--cy:#38bdf8;--bl:#3b82f6;--allow:#34d399;--chal:#fbbf24;--hold:#fb923c;--block:#f87171;--honey:#e8a838;--red:#f43f5e;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif}
:root[data-theme=light]{}
*{box-sizing:border-box}html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;overflow-x:hidden;
background-image:radial-gradient(900px 500px at 80% -10%,rgba(56,189,248,.09),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(59,130,246,.07),transparent 60%)}
button{font-family:inherit;color:inherit;cursor:pointer}
textarea,input,select{font-family:inherit;color:var(--tx)}
::selection{background:rgba(56,189,248,.3)}
.mono{font-family:var(--mono)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(6,8,12,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:13px;white-space:nowrap;background:none;border:0;padding:0}
.logo-mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#0e2a45,#0b1624);border:1px solid rgba(56,189,248,.45);color:var(--cy);box-shadow:0 0 18px rgba(56,189,248,.25)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;position:relative}
.nav::-webkit-scrollbar{display:none}
.nv{background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap;transition:.2s}
.nv:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.nv.on{color:var(--cy);background:rgba(56,189,248,.1)}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);font-family:var(--mono);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--allow);box-shadow:0 0 10px var(--allow);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .16s ease;z-index:50}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--tx);font-size:13px}
.menu button:hover{background:rgba(56,189,248,.1)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 70px}
.page{animation:fadeup .45s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ptitle{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--cy);text-transform:uppercase}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
.h1{font-size:clamp(24px,4vw,34px)}
.sub{color:var(--mut);max-width:760px}
.card{background:linear-gradient(180deg,rgba(17,24,35,.85),rgba(13,18,25,.85));border:1px solid var(--line);border-radius:14px;padding:16px}
.card.glass{background:rgba(17,24,35,.55);backdrop-filter:blur(10px)}
.card h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;font-family:var(--mono)}
.pill.allow{color:var(--allow);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.pill.challenge{color:var(--chal);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.pill.hold{color:var(--hold);border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.08)}
.pill.block{color:var(--block);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.pill.honeypot{color:var(--honey);border-color:rgba(232,168,56,.45);background:rgba(232,168,56,.08)}
.pill.cy{color:var(--cy);border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.08)}
.pill.demo{color:var(--chal);border-color:rgba(251,191,36,.35);border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:600;font-size:13px;transition:.18s;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--cy);background:rgba(56,189,248,.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#1a8fd0,#1769b8);border-color:#38bdf8;color:#fff;box-shadow:0 0 22px rgba(56,189,248,.25)}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#27a1e3,#1d78d0)}
.btn.red{background:linear-gradient(180deg,#c0324b,#8f2036);border-color:#f43f5e;color:#fff}
.btn.sm{padding:5px 11px;min-height:30px;font-size:12px}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--tx);transition:.18s}
.chip:hover{border-color:var(--cy);color:var(--cy)}
.chip.on{background:rgba(56,189,248,.14);border-color:var(--cy);color:var(--cy)}
.chip.bad{border-color:rgba(248,113,113,.3)}
.chip.bad:hover{border-color:var(--block);color:var(--block)}
textarea.in,input.in,select.in{width:100%;background:rgba(3,5,8,.7);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;transition:.2s;resize:vertical}
textarea.in:focus,input.in:focus,select.in:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
textarea.in{min-height:92px}
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line2);padding:clamp(20px,4vw,40px);background:linear-gradient(135deg,rgba(14,28,46,.9),rgba(8,12,18,.95))}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
.hero>*{position:relative}
.brand{font-size:clamp(34px,7vw,64px);font-weight:750;letter-spacing:.12em;line-height:1;background:linear-gradient(90deg,#fff,#7dd3fc 60%,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:clamp(16px,2.4vw,22px);color:var(--tx);margin:8px 0 4px}
.quote{color:var(--cy);font-style:italic;font-size:clamp(14px,2vw,17px)}
.status{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.st{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.25);font-family:var(--mono);font-size:11px;letter-spacing:.07em;color:#a7f3d0}
.flow{display:flex;align-items:center;gap:0;margin-top:26px;flex-wrap:wrap;row-gap:10px}
.fn{padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(6,8,12,.7);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-align:center}
.fn.u{border-color:rgba(248,113,113,.4);color:#fecaca}
.fn.f{border-color:rgba(56,189,248,.6);color:var(--cy);box-shadow:0 0 24px rgba(56,189,248,.2)}
.fn.b{border-color:rgba(52,211,153,.4);color:#a7f3d0}
.fl{height:2px;width:clamp(24px,6vw,70px);background:linear-gradient(90deg,transparent,var(--line2),transparent);position:relative;overflow:hidden}
.fl:after{content:"";position:absolute;top:-1px;width:16px;height:4px;border-radius:4px;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:travel 1.8s linear infinite}
.fl.d2:after{animation-delay:.6s}
@keyframes travel{from{left:-16px}to{left:100%}}
.metric{position:relative;overflow:hidden}
.metric .v{font-size:clamp(22px,3vw,28px);font-weight:700;font-family:var(--mono);letter-spacing:-.02em;margin:4px 0 2px}
.metric .l{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.metric .n{font-size:11px;color:var(--dim)}
.feed{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.fi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);animation:slidein .4s ease both;font-size:13px}
@keyframes slidein{from{opacity:0;transform:translateX(-12px);background:rgba(56,189,248,.12)}to{opacity:1;transform:none}}
.fi .t{color:var(--dim);font-family:var(--mono);font-size:11px}
.vdot{width:9px;height:9px;border-radius:50%}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;position:relative}
.pn{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:rgba(6,8,12,.6);transition:.3s;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px}
.pn .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.04);color:var(--dim);transition:.3s}
.pn .nm{font-size:10px;letter-spacing:.09em;font-family:var(--mono);color:var(--dim);transition:.3s}
.pn.act{border-color:var(--cy);box-shadow:0 0 22px rgba(56,189,248,.28);transform:translateY(-2px)}
.pn.act .ic{background:rgba(56,189,248,.18);color:var(--cy)}.pn.act .nm{color:var(--cy)}
.pn.act:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--cy),transparent);animation:scan 0.9s linear infinite}
@keyframes scan{0%{transform:translateX(-30%);opacity:.2}50%{opacity:1}100%{transform:translateX(30%);opacity:.2}}
.pn.done{border-color:rgba(52,211,153,.35)}.pn.done .ic{color:var(--allow);background:rgba(52,211,153,.1)}.pn.done .nm{color:#a7f3d0}
.pn.fin-block{border-color:rgba(248,113,113,.6);box-shadow:0 0 22px rgba(248,113,113,.25)}.pn.fin-block .ic{color:var(--block);background:rgba(248,113,113,.12)}.pn.fin-block .nm{color:var(--block)}
.pn.fin-chal{border-color:rgba(251,191,36,.6)}.pn.fin-chal .ic{color:var(--chal);background:rgba(251,191,36,.1)}.pn.fin-chal .nm{color:var(--chal)}
.pn.fin-hold{border-color:rgba(251,146,60,.6)}.pn.fin-hold .ic{color:var(--hold)}.pn.fin-hold .nm{color:var(--hold)}
.pn.fin-honeypot{border-color:rgba(232,168,56,.6)}.pn.fin-honeypot .ic{color:var(--honey)}.pn.fin-honeypot .nm{color:var(--honey)}
.verdict{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line2);padding:clamp(16px,3vw,26px);animation:vin .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes vin{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.verdict.allow{background:linear-gradient(135deg,rgba(52,211,153,.12),rgba(13,18,25,.9));border-color:rgba(52,211,153,.4)}
.verdict.challenge{background:linear-gradient(135deg,rgba(251,191,36,.11),rgba(13,18,25,.9));border-color:rgba(251,191,36,.4)}
.verdict.hold{background:linear-gradient(135deg,rgba(251,146,60,.12),rgba(13,18,25,.9));border-color:rgba(251,146,60,.4)}
.verdict.block{background:linear-gradient(135deg,rgba(248,113,113,.14),rgba(13,18,25,.9));border-color:rgba(248,113,113,.45);animation:vin .5s both,shake .45s .1s}
.verdict.honeypot{background:linear-gradient(135deg,rgba(232,168,56,.13),rgba(13,18,25,.9));border-color:rgba(232,168,56,.45)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.vhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.vlabel{font-size:clamp(24px,4.5vw,38px);font-weight:750;letter-spacing:.04em;line-height:1.05}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:16px}
.kv>div{background:rgba(3,5,8,.45);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.k{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;font-family:var(--mono);margin-bottom:3px}
.val{font-size:14px}
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:12px}
.five>div{padding:10px 12px;border-left:2px solid var(--cy);background:rgba(56,189,248,.04);border-radius:0 8px 8px 0}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lst li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.code{font-family:var(--mono);font-size:12.5px;background:rgba(3,5,8,.8);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--bl),var(--cy));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.split{grid-template-columns:1fr}.live .lt{display:none}.hdr-in{gap:8px}}
.term{background:#05070a;border-radius:12px;padding:14px;font-family:var(--mono);font-size:12.5px;min-height:150px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.red-card{border-color:rgba(244,63,94,.35);background:linear-gradient(180deg,rgba(60,14,24,.35),rgba(13,18,25,.9))}
.blue-card{border-color:rgba(56,189,248,.35);background:linear-gradient(180deg,rgba(11,36,60,.4),rgba(13,18,25,.9))}
.caret:after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--cy)}
@keyframes blink{50%{opacity:0}}
.det{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;border:1px solid rgba(56,189,248,.25);background:rgba(56,189,248,.06);margin-bottom:7px;animation:slidein .4s both;font-size:13px}
.neut{text-align:center;padding:18px;border-radius:14px;border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.09);color:#a7f3d0;font-weight:750;letter-spacing:.12em;font-size:clamp(16px,3vw,22px);animation:vin .5s both;box-shadow:0 0 40px rgba(52,211,153,.15)}
.canary{border-color:rgba(251,191,36,.45);background:linear-gradient(180deg,rgba(251,191,36,.06),rgba(13,18,25,.9))}
.alarm{padding:16px;border-radius:14px;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.6);color:#fecdd3;font-weight:750;letter-spacing:.1em;font-size:clamp(18px,3.5vw,26px);text-align:center;animation:alarm 1s infinite}
@keyframes alarm{0%,100%{box-shadow:0 0 0 rgba(244,63,94,0)}50%{box-shadow:0 0 36px rgba(244,63,94,.45)}}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;border:1px solid var(--line);color:var(--dim);transition:.4s;font-family:var(--mono);font-size:12px;letter-spacing:.07em}
.step.on{color:var(--tx);border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.08)}
.safe{padding:14px;border-radius:12px;border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.08);color:#a7f3d0;font-weight:600;display:flex;gap:10px;align-items:center}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lad{padding:10px 8px;border-radius:10px;border:1px solid var(--line);text-align:center;opacity:.55;transition:.4s}
.lad.on{opacity:1;transform:translateY(-2px)}
.lad b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.lad span{font-size:11px;color:var(--mut)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:820px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-family:var(--mono);padding:10px 12px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.02);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:.15s}tbody tr:hover{background:rgba(56,189,248,.06)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:61;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));animation:drawer .3s cubic-bezier(.2,.8,.2,1)}
@keyframes drawer{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.sec{margin-top:16px}
.sec>.k{margin-bottom:6px}
.arch{display:flex;flex-direction:column;align-items:center;gap:0}
.an{width:min(100%,520px);text-align:left;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:rgba(13,18,25,.9);display:flex;gap:12px;align-items:center;transition:.25s;position:relative}
.an:hover,.an.sel{transform:translateY(-1px);border-color:var(--cy);box-shadow:0 0 28px rgba(56,189,248,.2)}
.an.u{border-color:rgba(248,113,113,.45)}.an.ai{border-color:rgba(167,139,250,.5)}.an.det{border-color:rgba(56,189,248,.5)}.an.ok{border-color:rgba(52,211,153,.5)}
.an .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);flex:none}
.conn{width:2px;height:26px;background:linear-gradient(var(--line2),var(--cy));position:relative;overflow:hidden}
.conn:after{content:"";position:absolute;left:-1px;width:4px;height:10px;border-radius:4px;background:var(--cy);box-shadow:0 0 8px var(--cy);animation:down 1.6s linear infinite}
@keyframes down{from{top:-10px}to{top:100%}}
.callout{border-radius:16px;padding:clamp(18px,3vw,28px);border:1px solid rgba(56,189,248,.5);background:linear-gradient(135deg,rgba(14,50,82,.55),rgba(8,12,18,.95));box-shadow:0 0 50px rgba(56,189,248,.12)}
.callout .big{font-size:clamp(22px,4vw,34px);font-weight:750;letter-spacing:-.01em}
.empty{padding:34px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:14px}

/* ===== Simulated ledger + single execution gate (pure, testable) ===== */
const DAILY_LIMIT=100000;
function createLedger(init){
  const st={balance:init.balance,daily:0,locked:false,executed:new Set(),history:init.history.slice(),escapes:0,rejections:[],seq:0};
  const rej=(code,msg)=>{st.rejections.unshift({code,msg,ts:Date.now()});return {ok:false,code,msg};};
  function execute(r,o){
    o=o||{};
    if(o.origin==='sandbox'){st.escapes++;return rej('SANDBOX_ORIGIN','Sandbox sessions can never reach the banking gate.');}
    if(st.locked)return rej('LOCKED','Privileged actions are locked after a canary incident.');
    if(!r||!r.intent||r.intent.type!=='TRANSFER')return rej('NOT_A_TRANSFER','Only transfers pass through the execution gate.');
    const re=analyze(r.raw);                               // the gate re-derives the decision itself; it never trusts the caller's object
    if(re.decisionHash!==r.decisionHash||re.verdict!==r.verdict)return rej('TAMPERED_DECISION','Decision does not match a fresh evaluation of the request.');
    const ok=r.verdict==='ALLOW'||(r.verdict==='CHALLENGE'&&o.verified===true&&r.signals.length===0);
    if(!ok)return rej('VERDICT','Verdict '+r.verdict+' does not permit execution.');
    const a=r.intent.amount;
    if(!r.intent.beneficiary||a==null||!(a>0))return rej('INCOMPLETE','Beneficiary or amount missing.');
    const key=r.ts+':'+r.requestHash;
    if(st.executed.has(key))return rej('DUPLICATE','This decision was already executed (replay rejected).');
    if(a>st.balance)return rej('FUNDS','Insufficient simulated funds.');
    if(st.daily+a>DAILY_LIMIT)return rej('DAILY_LIMIT','Daily simulated transfer limit would be exceeded.');
    st.executed.add(key);st.balance-=a;st.daily+=a;
    const tx={id:'t'+(++st.seq)+'_'+Date.now(),ts:Date.now(),to:r.intent.beneficiary.name,amt:a,memo:r.intent.memo||'',status:'COMPLETED'};
    st.history.unshift(tx);return {ok:true,tx};
  }
  function addBlocked(r){const a=r.intent&&r.intent.amount||0;const to=r.intent&&(r.intent.beneficiary?r.intent.beneficiary.name:(r.intent.unknownName||'—'))||'—';
    st.history.unshift({id:'t'+(++st.seq)+'_'+Date.now(),ts:Date.now(),to,amt:a,memo:'',status:'BLOCKED'});}
  return {st,execute,addBlocked,lock(){st.locked=true;},unlock(){st.locked=false;},snapshot(){return {balance:st.balance,daily:st.daily,locked:st.locked,history:st.history.slice(),escapes:st.escapes,rejections:st.rejections.slice(0,20)};}};
}
